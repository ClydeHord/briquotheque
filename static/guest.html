<head>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='10' width='28' height='18' rx='3' fill='%23e3000b'/><rect x='7' y='5' width='7' height='7' rx='2' fill='%23e3000b'/><rect x='18' y='5' width='7' height='7' rx='2' fill='%23e3000b'/></svg>">
<title>Collection LEGO — Briquothèque</title>
<link rel="stylesheet" href="/style.css">
<style>
  .guest-tag { font-size: 12px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; }
  .tabs-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 6px; }
  .tabs-row button { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 7px 14px; cursor: pointer; font-weight: 600; }
  .tabs-row button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .tabs-row .sep { width: 1px; background: var(--line); margin: 0 4px; }
  .g-main { max-width: 1280px; margin: 0 auto; padding: 22px 20px 60px; }
  .card { cursor: default; }
  .card:hover { transform: none; }
  .figs-line { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  @media (max-width: 600px) {
    .g-main { padding: 14px 12px 40px; }
    /* onglets des listes : retour à la ligne (plus de défilement horizontal) */
    .tabs-row { flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
    .tabs-row button { padding: 6px 11px; font-size: 13.5px; line-height: 1.25; text-align: left; max-width: 100%; }
    .tabs-row .sep { flex-basis: 100%; width: auto; height: 0; margin: 2px 0; background: none; }
    .stats { grid-template-columns: repeat(3, 1fr); }
    .stats .main-stat { grid-column: auto; }
    .stats .main-stat .val { font-size: 19px; }
    .guest-tag { font-size: 11px; }
    .brand span:last-child { display: inline; font-size: 16px; }
  }
  .card[data-i] { cursor: pointer; }
  .card[data-i]:hover { border-color: var(--muted); }
  .prices3 { color: var(--ink); } .prices3 b { font-variant-numeric: tabular-nums; }
  .gdetail { position: fixed; inset: 0; z-index: 60; background: rgba(10,12,16,.6); display: grid; place-items: center; padding: 16px; }
  .gd-box { position: relative; background: var(--panel); border-radius: 18px; width: min(760px, 100%); max-height: calc(100vh - 32px); overflow: auto; }
  .gd-x { position: absolute; top: 8px; right: 8px; z-index: 2; border: 0; background: var(--panel); border-radius: 50%; width: 38px; height: 38px; font-size: 20px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .gd-img { display: block; width: 100%; max-height: 52vh; object-fit: contain; background: #fff; border-radius: 18px 18px 0 0; cursor: zoom-in; }
  .gd-img.big { max-height: none; cursor: zoom-out; }
  .gd-body { padding: 14px 18px 18px; }
  .gd-body h2 { margin: 2px 0 4px; font-size: 20px; }
  .gd-status { margin: 10px 0 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .gd-prices { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 10px 0; }
  .gd-prices div { background: var(--bg); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; }
  .gd-prices span { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .gd-prices b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .gd-figs { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; margin: 12px 0; }
  .gd-figs figure { margin: 0; text-align: center; font-size: 11.5px; }
  .gd-figs img { width: 100%; aspect-ratio: 3/4; object-fit: contain; background: #fff; border-radius: 8px; border: 1px solid var(--line); }
  .gd-links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .gd-links a { font-size: 13px; font-weight: 700; padding: 7px 12px; border-radius: 99px; border: 1px solid var(--line); text-decoration: none; color: var(--ink); }
  .gd-links a:hover { border-color: var(--red); color: var(--red); }
  @media (max-width: 600px) { .gdetail { padding: 0; place-items: end stretch; } .gd-box { border-radius: 18px 18px 0 0; max-height: 92vh; } }
  .tab-sub { font-size: 11px; font-weight: 700; opacity: .65; margin-left: 2px; }
  .gstats { margin: 0 0 14px; padding: 12px 16px; }
  .stat-btn { cursor: pointer; }
  .stat-btn:hover { border-color: var(--red); }
  .gp-box { width: min(980px, 100%); }
  .gp-tools { display: flex; gap: 8px; margin: 10px 0; }
  .gp-tools input { flex: 1 1 auto; min-width: 0; }
  .gp-tools select { flex: 0 0 auto; max-width: 45%; }
  .gp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  @media (max-width: 600px) { .gp-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .gp-card { display: flex; flex-direction: column; gap: 2px; padding: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
    font: inherit; font-size: 12.5px; color: inherit; text-align: left; cursor: pointer; }
  div.gp-card { cursor: default; }
  .gp-card:hover { border-color: var(--muted); }
  .gp-pic { aspect-ratio: 1 / 1; background: #fff; border-radius: 8px; display: grid; place-items: center; overflow: hidden; margin-bottom: 4px; font-size: 28px; }
  .gp-pic img { width: 100%; height: 100%; object-fit: contain; }
  .gp-id { color: var(--muted); font-size: 11.5px; font-weight: 600; }
  .gp-name { font-weight: 600; line-height: 1.25; display: flex; align-items: center; gap: 5px; }
  .gp-sw { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--line); flex: none; }
  .gp-more { grid-column: 1 / -1; justify-self: center; margin-top: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 7px 14px; cursor: pointer; font: inherit; }
  .gstats > summary { cursor: pointer; font-weight: 700; color: var(--ink); font-size: 15px; }
  .gstats[open] > summary { margin-bottom: 10px; }
  .gs-kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .gs-kpis div { background: var(--bg); border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; }
  .gs-kpis span { font-size: 12px; color: var(--muted); font-weight: 600; }
  .gs-kpis b { font-size: 18px; font-variant-numeric: tabular-nums; }
  .gstats h3 { font-size: 14.5px; margin: 14px 0 4px; }
  .gstats .vx { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 10.5px; color: var(--muted); white-space: nowrap; }
  .gd-acc-t { font-size: 14px; margin: 14px 0 6px; }
  .gd-zoom { cursor: zoom-in; }
  .gd-noimg { aspect-ratio: 3/4; display: grid; place-items: center; font-size: 28px; background: var(--bg); border-radius: 8px; }
  .gd-zoomed { position: fixed; inset: 0; z-index: 100; background: rgba(10,12,16,.88); display: grid; place-items: center; padding: 16px; cursor: zoom-out; }
  .gd-zoomed img { max-width: 94vw; max-height: 90vh; object-fit: contain; background: #fff; border-radius: 12px; }
  .subtabs { padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; margin: 2px 0 10px; }
  .subtabs button { font-size: 13.5px; padding: 6px 12px; background: var(--bg); border-color: transparent; }
  .subtabs button.all { background: none; border-color: var(--line); }
  .subtabs button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  #title .crumbs { margin-bottom: 2px; }
  @media (max-width: 600px) { .subtabs { margin: 2px 0 10px; border-radius: 12px; } }
  .figs-line img { width: 26px; height: 32px; object-fit: contain; background: #fff; border: 1px solid var(--line); border-radius: 4px; }
.acc-line .acc-noimg { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 6px; background: #fff; font-size: 17px; }
  .acc-line img { width: 34px; height: 34px; }
  .acc-line .more-parts { width: 34px; height: 34px; font-size: 13px; font-weight: 700; }
  .gd-lots { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; max-height: 420px; overflow: auto; }
  .gd-lot { display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 5px; font-size: 13px; }
  .gd-lot img, .gd-lot .gd-noimg { width: 40px; height: 40px; flex: none; object-fit: contain; background: #fff; border-radius: 6px; display: grid; place-items: center; }
  .gd-lot img { cursor: zoom-in; }
  .gd-lot span { min-width: 0; } .gd-lot b { font-weight: 600; } .gd-lot em { font-style: normal; color: var(--muted); }
  .gd-lot small { display: block; color: var(--muted); font-size: 11.5px; }
  .more-parts { width: 28px; height: 28px; border-radius: 6px; border: 1px dashed var(--muted); background: transparent; color: var(--ink); font-size: 18px; line-height: 1; cursor: pointer; display: inline-grid; place-items: center; padding: 0; }
  .more-parts:hover { border-color: var(--red); color: var(--red); }
  .to-top { bottom: calc(20px + env(safe-area-inset-bottom, 0px)) !important; }
  .topbar { flex-wrap: wrap; row-gap: 6px; }
  /* liens vers les autres pages publiques : en fin de rangée des listes, sous le titre, comme des onglets */
  .pub-link { display: inline-flex; align-items: center; border: 1px solid var(--red); color: var(--red); background: var(--panel); border-radius: 99px;
    padding: 7px 14px; font-weight: 700; text-decoration: none; white-space: nowrap; }
  .pub-link:hover { background: var(--red); color: #fff; }
  @media (max-width: 520px) { .pub-link { padding: 6px 11px; font-size: 13.5px; } }
  /* fiche : même présentation que la fiche de la page privée (lecture seule) */
  .gs-box { width: min(760px, 100%); padding: 0; display: flex; flex-direction: column; overflow: hidden; }
  .gs-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .gs-head h2 { flex: 1; margin: 0; font-size: 19px; line-height: 1.25; }
  .gs-head .gd-x { position: static; box-shadow: none; flex: none; width: 34px; height: 34px; font-size: 18px; background: transparent; color: var(--ink); }
  .gs-head .gd-x:hover { background: var(--bg); }
  .gs-body { padding: 12px 18px 18px; overflow: auto; }
  .gs-body .cfg-top .gd-img { width: 100%; aspect-ratio: 4/3; max-height: none; object-fit: contain; background: #fff; border-radius: 12px; border: 1px solid var(--line); cursor: zoom-in; }
  .gs-price { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .gs-num { font-size: 13px; font-weight: 700; color: var(--muted); margin: 2px 0; }
  .gs-qty { font-size: 13.5px; margin-top: 8px; }
  .card.gs-tags { all: unset; display: block; margin-top: 6px; }
  html[data-ui] .card.gs-tags { border: 0; box-shadow: none; background: none; -webkit-backdrop-filter: none; backdrop-filter: none; transform: none; }   /* (les thèmes — Néon… — n'entourent pas ce bloc invisible) */
  .gs-figs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .gs-figs .fig.figq { grid-template-columns: 44px minmax(0, 1fr); align-items: center; border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
    padding: 5px 6px 5px 5px; gap: 4px 9px; min-width: 0; cursor: default; font: inherit; color: inherit; text-align: left; }
  .gs-figs .fq-pic { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .gs-figs .fq-pic img, .gs-figs .fq-pic .gd-noimg { width: 44px; height: 44px; object-fit: contain; background: #fff; border-radius: 8px; padding: 2px; box-sizing: border-box; aspect-ratio: auto; font-size: 20px; }
  .gs-figs .fq-pic img.wide { object-fit: cover; padding: 0; }   /* photo prise en largeur : recadrée, même taille que les autres */
  .gs-figs .fq-n { font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .gs-figs .fq-txt .fn { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; }
  .gs-figs .fq-txt .fv { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11.5px; }
  .gs-figs button.gs-set { cursor: pointer; } .gs-figs button.gs-set:hover { border-color: var(--red); }
  .gs-est { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 12px 0; }
  .gs-est-t { color: var(--muted); font-size: 14px; } .gs-est > b { display: block; font-size: 20px; margin: 2px 0 6px; font-variant-numeric: tabular-nums; }
  .gs-est-l { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); } .gs-est-l b { color: var(--ink); font-variant-numeric: tabular-nums; }
  @media (max-width: 600px) { .gs-head { padding: 12px 14px 8px; } .gs-body { padding: 10px 14px 16px; } }
  /* 2e ligne (la liste ouverte) : en haut de la page, collée sous l'en-tête en défilant — comme la page privée */
  .g-main > .top-views2 { position: sticky; top: var(--hdr-h, 58px); z-index: 15; display: flex; justify-content: flex-end; gap: 4px;
    margin: -22px -20px 14px; padding: 8px 20px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .g-main > .top-views2[hidden] { display: none; }
  @media (max-width: 820px) { .g-main > .top-views2 { margin: -14px -12px 10px; padding: 6px 12px; justify-content: flex-start; flex-wrap: wrap; } }
  .stat-link { cursor: pointer; }
  /* figurines ouvertes en grand : chaque exemplaire, un par un (page publique seulement) */
  .gs-figs [data-parade] { cursor: zoom-in; }
  .parade { position: fixed; inset: 0; z-index: 120; background: rgba(8, 10, 14, .92); overflow: auto; padding: 22px 16px 40px; cursor: zoom-out; }
  .parade h2 { color: #fff; text-align: center; margin: 0 0 4px; font-size: 20px; }
  .parade .parade-sub { color: rgba(255,255,255,.7); text-align: center; font-size: 13.5px; margin-bottom: 18px; }
  .parade .parade-grid { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 14px; max-width: 1400px; margin: 0 auto; }
  .parade figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; opacity: 0; transform: translateY(26px) scale(.9);
    animation: parade-in .45s cubic-bezier(.2, .8, .3, 1.2) forwards; }
  .parade figure img { height: min(46vh, 340px); width: auto; max-width: 42vw; object-fit: contain; background: #fff; border-radius: 14px; padding: 8px; box-sizing: border-box; }
  .parade figure img.wide { height: min(34vh, 260px); }
  .parade figcaption { color: rgba(255,255,255,.85); font-size: 12.5px; font-weight: 700; text-align: center; max-width: 220px; }
  .parade figcaption small { display: block; font-weight: 500; opacity: .75; }
  .parade.many figure img { height: min(28vh, 200px); }
  .parade .parade-x { position: fixed; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.15); color: #fff; font-size: 20px; cursor: pointer; }
  @keyframes parade-in { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .parade figure { animation: none; opacity: 1; transform: none; } }
/* logo d'une liste (devant son nom : menu, titre, pastilles ; pages publiques aussi) */
.list-logo { height: 1.15em; width: auto; max-width: 6em; object-fit: contain; vertical-align: -0.2em; margin-right: .3em; background: transparent !important; border: 0; box-shadow: none; padding: 0; border-radius: 0; }
.list-logo.big { height: 1em; }   /* hauteur d'un emoji, largeur selon le recadrage du logo */
.list-emo { margin-right: .3em; }   /* emoji choisi (ou d'office) devant le nom : comme un logo */
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }   /* lu, pas affiché (nom de liste masqué) */
#listTitle .list-logo:has(+ .vh), #title .list-logo:has(+ .vh) { height: 1.8em; }   /* titre sans nom : le logo, plus grand */
#listTitle .list-emo:has(+ .vh), #title .list-emo:has(+ .vh) { font-size: 1.6em; }
/* carte : logo de la liste, tout petit, à gauche de la référence (vues de plusieurs listes) */
.num-list { display: inline-flex; align-items: center; margin-right: .35em; vertical-align: -0.1em; }
.list-logo.tiny { height: 1em; max-width: 4.5em; margin-right: 0; }
.num-list .list-emo { margin-right: 0; font-size: .95em; }
/* étiquette « Incomplet » : quelque chose a été retiré sans rien à la place */
.tg.tg-inc, .card .tagline .tg.tg-inc { color: #8a6d00; border-color: rgba(176, 140, 0, .45); font-size: 10px; padding: 0 5px; line-height: 1.5; font-weight: 600; background: none; }
@media (prefers-color-scheme: dark) { .tg.tg-inc, .card .tagline .tg.tg-inc { color: #e6c84f; border-color: rgba(230, 200, 79, .4); } }
/* carte : logo de la liste en bas à droite, plus gros (vues de plusieurs listes) */
.card { position: relative; }
.card .num .num-list { position: absolute; right: 12px; bottom: 12px; margin: 0; z-index: 1; pointer-events: none; }
.card .num .num-list .list-logo.tiny { height: 20px; max-width: 76px; }
.card .num .num-list .list-emo { font-size: 18px; line-height: 1; }

/* barre du haut d'une liste : logo devant le nom ; nom masqué : le logo seul, un peu plus grand (sans grandir la pastille) */
.tv-home .nm .list-logo { height: 1.25em; vertical-align: -0.28em; }
.tv-home .nm .list-logo:has(+ .vh) { height: 1.7em; margin: -.3em 0; vertical-align: middle; }
.tv-home .nm .list-emo:has(+ .vh) { margin-right: 0; font-size: 1.15em; }

  /* variation d'un prix depuis le dernier relevé (↑ ↓ ~) : très discrète */
  .trend { display: inline-block; margin-left: .32em; font-size: calc(.82em * var(--trend-k, 1)); font-weight: 800; line-height: 1; vertical-align: .08em; font-style: normal; }
  .trend.up { color: #16a34a; } .trend.down { color: #dc2626; } .trend.eq { color: var(--trend-eq, #2563eb); opacity: 1; }
  @media (prefers-color-scheme: dark) { :root { --trend-eq: #60a5fa; } }   /* (« ~ » en sombre : un bleu plus clair, qui ressort sans crier) */
  .trend i { font-style: normal; font-weight: 600; margin-left: .25em; }

  /* barre collée : retour à toute la collection + listes principales (une ligne, défile de côté) — les listes restent à portée en défilant */
  .g-main > .top-views2:has(.g-nav:not(.only-back):not([hidden])) { flex-wrap: wrap; }
  .g-nav { display: flex; gap: 6px; align-items: center; flex: 1 0 100%; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .g-nav::-webkit-scrollbar { display: none; }
  .g-nav.only-back { flex: 0 0 auto; margin-right: auto; overflow: visible; }
  .g-nav.only-back [data-gl] { display: none; }
  .g-nav[hidden] { display: none; }
  .g-nav button { flex: 0 0 auto; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 99px; padding: 5px 12px; cursor: pointer; font-weight: 600; font-size: 13.5px; white-space: nowrap; }
  .g-nav button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .g-nav .g-back { background: transparent; color: var(--muted, #6b7280); }
  .g-back-head { display: inline-flex; align-items: center; gap: 4px; margin-left: 6px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent;
    color: var(--muted, #6b7280); font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .g-back-head:hover { color: var(--ink); border-color: var(--red); }
  .g-nav .g-back:hover { color: var(--ink); }

/* carte : le logo de la liste dans la ligne du prix, à droite — le prix garde toute sa place, le logo prend ce qui reste (76 px au plus) et rétrécit s'il le faut */
.card .foot { gap: 8px; }
.card .foot .value { flex: 0 0 auto; max-width: 100%; }
.card .foot .num-list { position: static; flex: 0 1 auto; min-width: 0; max-width: 76px; margin: 0 0 0 auto; align-self: flex-end; display: flex; justify-content: flex-end; overflow: hidden; pointer-events: none; }
.card .foot .num-list .list-logo.tiny { height: 20px; width: auto; min-width: 0; max-width: 100%; margin: 0; object-fit: contain; object-position: right center; }
.card .foot .num-list .list-emo { font-size: 18px; line-height: 1; margin: 0; }
.card .foot.foot-logo { justify-content: flex-end; }

  /* « 🔃 Renverser le tri » : bouton de la barre (téléphone compris) */
  .toolbar > .sort-rev { flex: none; padding: 0 12px; }
  @media (max-width: 600px) {   /* téléphone : le bouton tient dans la barre — marges resserrées, et sous 400 px « ⇅ » sans le mot « Tri » */
    .toolbar > .sort-rev { padding: 0 9px; }
    :is(.main, .g-main) > .toolbar .filt-menu > summary { padding: 0 8px; }
  }
  @media (max-width: 480px) { .toolbar .filt-menu .filt-w { display: none; } }   /* téléphone : « ⚙️ » et « ⇅ » seuls */
  .toolbar > .trend-tog { flex: none; padding: 0 12px; }

<script>
"use strict";
/* image en cours de chargement : un rond qui tourne ; échec : « ↻ » — un appui la redemande */
const IMG_RETRY = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 30'%3E%3Cg fill='none' stroke='%23999' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M26.5 10.5a8 8 0 1 0 1.5 7'/%3E%3Cpath d='M27.5 5.5v5.5h-5.5'/%3E%3C/g%3E%3C/svg%3E";
{
  const mark = im => { const s = im.getAttribute("src") || ""; if (s && !/^(data|blob):/.test(s) && !im.complete) im.classList.add("img-ld"); else im.classList.remove("img-ld"); };
  new MutationObserver(ms => { for (const m of ms) {
    if (m.type === "attributes") { if (m.target.tagName === "IMG") mark(m.target); continue; }
    for (const n of m.addedNodes) if (n.nodeType === 1) { if (n.tagName === "IMG") mark(n); else if (n.querySelectorAll) n.querySelectorAll("img").forEach(mark); }

}

const $ = s => document.querySelector(s);

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const base = location.pathname.replace(/\/$/, "");

const LIST_EMOJIS = ["🧱", "🚀", "🏰", "🚗", "🛸", "🦖", "🤖", "🛡️", "⚔️", "🌋", "🏙️", "🚂", "✈️", "🐉", "👾", "🎮", "🎬", "🌌", "🏎️", "🚓", "🚒", "🏝️", "🎪", "🧩", "💎", "🔧", "🌲", "🐲", "🦸", "🧙", "🏴‍☠️", "⚓", "🚁", "🛰️", "🌍", "🎸", "🍕", "🐺", "🦁", "🐼"];
const listEmoDefault = l => { if (!l || l.emoji_off || (l.kind || "collection") !== "collection" || /\p{Extended_Pictographic}/u.test(l.name || "")) return "";   // (le nom a déjà son emoji)
  let h = 0; for (const c of String(l.id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return LIST_EMOJIS[h % LIST_EMOJIS.length]; };   // au hasard, mais toujours le même pour une liste
/* affichage d'une liste, à la carte : ctx « menu » (menu de gauche ; pages publiques : la rangée des listes) ou « view » (tout le reste) →

const listShow = (l, ctx = "view") => {
  if (!l) return { e: false, l: false, n: true };

};
const listNm = (l, name, ctx = "view") => l && name === l.name && !listShow(l, ctx).n ? `<span class="vh">${esc(name)}</span>` : esc(name);   // nom masqué : il reste lu

  return (r.e ? `<span class="list-emo">${esc(l.emoji || listEmoDefault(l))}</span>` : "") + (r.l ? `<img class="${cls}" src="${img(l.logo)}" alt="">` : ""); };

};
document.addEventListener("error", e => { const t = e.target; if (t.tagName !== "IMG") return;

  else if (!t.classList.contains("img-missing")) { t.classList.add("img-missing"); t.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 30'%3E%3Cg fill='none' stroke='%23888' stroke-width='1.5' opacity='.55'%3E%3Crect x='6' y='12' width='28' height='13' rx='2'/%3E%3Crect x='10' y='7' width='7' height='5' rx='1'/%3E%3Crect x='23' y='7' width='7' height='5' rx='1'/%3E%3C/g%3E%3C/svg%3E"; } }, true);
/* liens entre les pages publiques : à la fin de la rangée des listes, sous le titre (même endroit sur chaque page) */
function pubLinksHtml(page, owner) {
  const col = owner ? `📚 Collection de ${owner}` : "📚 La collection", wish = owner ? `⭐ Liste de souhaits de ${owner}` : "⭐ Liste de souhaits";

    watch: [["/collection", col], ["/wishlist", wish]], nouveautes: [["/collection", col], ["/wishlist", wish]] }[page] || [];

let data = { lists: [], items: [] }, current = ALL;

const isFigLike = i => (i.kind === "fig" && !i.as_set) || (i.kind === "custom" && i.custom_type === "fig");
const isMoc = i => i.kind === "custom" && !i.partial_set && !i.catalog_set;   // vrai MOC (pas un set partiel, ni un set hors catalogue)

const piecesTxt = (p, q = 1) => !p ? "" : (q || 1) > 1 ? `${nf.format(p * q)} pièces (${nf.format(p)} l'unité)` : `${nf.format(p)} pièces`;

const MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
const MONTHS = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];
function rDate(s) {
  if (!s) return null; const t = s.toLowerCase(), y = +(t.match(/(20\d\d)/) || [])[1]; if (!y) return null;
  const mi = MONTHS.findIndex(m => t.includes(m));
  if (mi >= 0) return { d: new Date(y, mi + 1, 0), txt: MOIS[mi] + " " + y };
  if (/end|late/.test(t)) return { d: new Date(y, 11, 31), txt: "fin " + y };
  if (/mid/.test(t)) return { d: new Date(y, 5, 30), txt: "mi-" + y };

}
const upcoming = i => /pending|upcoming|coming soon/i.test(i.info?.availability || "");

/* « À surveiller » : l'état recherché (« Neuf », « Occasion · boîte · plan · figurines ») */
const wishLabel = i => i.condition === "neuf" ? "Neuf" + (i.with_minifigs === false && i.info?.minifig_count ? " · sans figurines" : "")

const descOf = (id, seen = new Set()) => childLists(id).flatMap(l => seen.has(l.id) ? [] : (seen.add(l.id), [l.id, ...descOf(l.id, seen)]));
let pubDirect = null;
const shownOf = id => id === ALL || pubDirect === id || !descOf(id).length ? itemsOf(id) : [id, ...descOf(id)].flatMap(itemsOf);

function figCount(i) {   // = summary (app.js) : figurines seules, celles du set que j'ai, et celles rangées dedans (ajoutées, MOC)
  if (isFigLike(i)) return i.quantity;
  const added = (i.info?.minifigs || []).filter(m => m.added);
  const addE = added.length, addQ = added.reduce((a, m) => a + (m.qty || 1), 0);   // (la page privée : une par fiche rangée si la liste du set est connue, sinon leur nombre)

/* toutes les pièces (sans prix) : une carte par pièce, couleurs réunies ; une pièce → ses couleurs */
function gModal(title) {

function openGuestParts(listId) {

/* statistiques insolites de la page publique : ordres de grandeur amusants, jamais de prix */
function guestOdd(items) {
  const out = [], card = (ico, val, txt) => out.push(`<div class="odd"><div class="odd-ico">${ico}</div><div><b>${val}</b><p>${txt}</p></div></div>`);
  const fr = (v, d = 1) => v.toLocaleString("fr-FR", { maximumFractionDigits: d });
  const nPieces = items.filter(i => i.kind === "set").reduce((a, i) => a + Math.round((i.info?.pieces || 0) * (i.portion ?? 100) / 100) * i.quantity, 0);
  if (nPieces) {
    const hgt = nPieces * 0.0096;   // une hauteur de brique (9,6 mm) par pièce
    card("🗼", hgt >= 1000 ? `${fr(hgt / 1000, 2)} km` : `${fr(hgt, 0)} m`, `de haut si toutes les pièces étaient empilées${hgt > 330 ? `, soit <b>${fr(hgt / 330)}</b> tour${hgt / 330 >= 2 ? "s" : ""} Eiffel` : ` (la tour Eiffel fait 330 m)`}.`);
    const kg = nPieces * 1.5 / 1000;   // environ 1,5 g par pièce
    card("⚖️", kg >= 1000 ? `≈ ${fr(kg / 1000, 2)} t` : `≈ ${fr(kg, 0)} kg`, `de plastique (environ 1,5 g par pièce), soit à peu près ${kg >= 80 ? `le poids de <b>${fr(kg / 80)}</b> adulte${kg / 80 >= 2 ? "s" : ""}` : `<b>${fr(kg / 12)}</b> pack${kg / 12 >= 2 ? "s" : ""} de 12 bouteilles d'eau`}.`);
    const hrs = nPieces / 500;   // environ 500 pièces montées par heure
    card("⏱️", `${fr(hrs, 0)} h`, `de montage pour tout reconstruire (à environ 500 pièces par heure)${hrs > 24 ? `, soit <b>${fr(hrs / 24)}</b> jours sans dormir` : ""}.`);
  }
  const figs = new Map();   // figurines : seules et dans les sets
  for (const i of items) {
    if (isFigLike(i)) { const k = i.number; figs.set(k, { name: i.info?.name || k, n: (figs.get(k)?.n || 0) + i.quantity }); continue; }
    for (const f of i.info?.minifigs || []) figs.set(f.id, { name: f.name, n: (figs.get(f.id)?.n || 0) + (f.qty || 1) });   // nombre déjà possédé (tous exemplaires)
  }
  const nFigs = items.reduce((a, i) => a + figCount(i), 0);
  if (nFigs) card("🚶", `${fr(nFigs * 0.04, 1)} m`, `de figurines si les ${nf.format(nFigs)} se tenaient côte à côte (4 cm chacune).`);
  const topFig = [...figs.values()].sort((a, b) => b.n - a.n)[0];
  if (topFig?.n > 1) card("👯", `×${topFig.n}`, `<b>${esc(topFig.name)}</b> est la figurine la plus présente : une petite armée à elle seule.`);
  const words = new Map();
  for (const f of figs.values()) for (const w of (f.name || "").split(/[\s,()'’-]+/)) {
    const k = w.trim(); if (k.length < 4 || /^(avec|dans|from|with|pour|sans|the)$/i.test(k)) continue;
    words.set(k.toLowerCase(), { w: k, n: (words.get(k.toLowerCase())?.n || 0) + f.n });
  }
  const tw = [...words.values()].sort((a, b) => b.n - a.n)[0];
  if (tw?.n > 2) card("🔤", `« ${esc(tw.w)} »`, `est le mot qui revient le plus dans les noms des figurines (${tw.n} fois).`);
  const dated = items.filter(i => i.kind === "set" && parseInt(i.info?.year));
  if (dated.length) {
    const y = new Date().getFullYear(), old = dated.reduce((a, i) => parseInt(i.info.year) < parseInt(a.info.year) ? i : a);
    const avg = dated.reduce((a, i) => a + (y - parseInt(i.info.year)), 0) / dated.length;
    card("🕰️", `${y - parseInt(old.info.year)} ans`, `pour le doyen, <b>${esc(old.display_name || old.info.name || old.number)}</b> (${old.info.year}). Âge moyen des sets : ${fr(avg)} ans.`);
  }
  return out.length ? `<h3>🤯 Insolite</h3><p class="muted small" style="margin:0 0 8px">Ordres de grandeur amusants (hauteur, poids et temps de montage approximatifs).</p><div class="odd-grid">${out.join("")}</div>` : "";
}

        ${inf.retail ? `<div><span>Prix magasin</span><b>${money(inf.retail)}</b></div>` : ""}
        ${retired(i) && inf.new_value ? `<div><span>Neuf</span><b>${zf(inf.zones?.new)}${money(inf.new_value)}</b></div>` : ""}
        ${inf.used_value && !upcoming(i) ? `<div><span>Occasion (estimation)</span><b>${zf(inf.zones?.used)}${money(inf.used_value)}</b></div>` : ""}
      </div>` : ""}
    ${(i.alts || []).length ? `<fieldset><legend>Apparences alternatives</legend><div class="gs-figs">${i.alts.map((a, k) => `<div class="fig figq"><span class="fq-pic"><img src="${img(a.photo)}" alt="" loading="lazy" data-galk="${k + 1}" title="Agrandir"></span>
      <span class="fq-txt"><span class="fn">${esc(a.name || "Apparence " + (k + 1))}</span></span></div>`).join("")}</div></fieldset>` : ""}
    ${figs.length ? `<fieldset><legend>Figurines</legend>
      ${nOwn ? `<div class="fig-sub">${nf.format(nOwn)} ${wishItem ? "dans le set" : `originale${nOwn > 1 ? "s" : ""}`}</div><div class="gs-figs">${own.map(f => figTile(f, wishItem ? "" : `${f.qty || 1} dans le set`)).join("")}</div>` : ""}
      ${nMod ? `<div class="fig-sub">${nf.format(nMod)} modifiée${nMod > 1 ? "s" : ""}</div><div class="gs-figs">${modi.map(f => figTile({ ...f, mod: false })).join("")}</div>` : ""}
      ${nAdd ? `<div class="fig-sub">${nf.format(nAdd)} ajoutée${nAdd > 1 ? "s" : ""}</div><div class="gs-figs">${added.map(f => figTile(f, f.same ? "comme celle du set" : "")).join("")}</div>` : ""}
    </fieldset>` : ""}
    ${(i.accessories || []).length ? `<fieldset><legend>Accessoires (Mini-construction)</legend><div class="gs-figs">${i.accessories.map(a => `<div class="fig figq"><span class="fq-pic">${a.photo
      ? `<img src="${img(a.photo)}" alt="" loading="lazy" class="gd-zoom" title="Agrandir">` : `<span class="gd-noimg">🗡️</span>`}</span><span class="fq-txt"><span class="fn">${esc(a.name)}</span></span></div>`).join("")}</div></fieldset>` : ""}
    ${i.kind === "fig" && !wishItem ? `<div data-objs>${objsHtml(i.fig_objs)}</div>` : ""}
    ${(i.moc_lots || []).length ? `<fieldset><legend>Pièces (${nf.format(i.moc_lots.reduce((a, x) => a + (x.qty || 1), 0))})</legend><div class="gd-lots">${i.moc_lots.map(x => `<div class="gd-lot">
        ${x.image ? `<img src="${img(x.image)}" alt="${esc(x.name)}" loading="lazy" class="gd-zoom" title="Agrandir">` : `<span class="gd-noimg">🧱</span>`}<span><b>${esc(x.name)}</b>${(x.qty || 1) > 1 ? ` <em>×${x.qty}</em>` : ""}<small>${esc(x.part)}${x.color ? " · " + esc(x.color) : ""}</small></span></div>`).join("")}</div></fieldset>` : ""}
    ${est ? `<div class="gs-est"><div class="gs-est-t">Estimation ${i.kind === "fig" ? "de la figurine" : isCustom(i) ? "du MOC" : "du set"}</div><b>${moneyA(inf.estimate, i.approx)}</b>
      ${inf.used_value ? `<div class="gs-est-l"><span>${i.kind === "set" ? "Set complet d'occasion" : "Occasion (catalogue)"}</span><b>${zf(inf.zones?.used)}${money(inf.used_value * (i.quantity || 1))}</b></div>` : ""}
      ${inf.new_value ? `<div class="gs-est-l"><span>Neuf (catalogue)</span><b>${zf(inf.zones?.new)}${money(inf.new_value * (i.quantity || 1))}</b></div>` : ""}</div>` : ""}
    ${(() => {   /* prix en bulles au-dessus des liens, comme la page privée (prix publics seulement ; pas les MOC ni la liste de souhaits) — 21/11 */
      if (!PRICES() || wishItem || isMoc(i)) return "";
      const fig = i.kind === "fig", p = v => `<b>${money(v)}</b>`, rows = [], sf = inf.sf || {};
      if (!fig && inf.retail != null) rows.push(`Prix magasin : ${p(inf.retail)}${retired(i) ? " (retiré)" : ""}`);
      const nv = fig ? inf.new : inf.new_value ?? (retired(i) ? null : inf.retail), uv = fig ? inf.used : inf.used_value;
      if (nv != null || sf.neuf != null) rows.push([nv != null ? `Neuf : ${p(nv)}` : "", sf.neuf != null ? `<span class="tf-sf">sans figurines : ${p(sf.neuf)}</span>` : ""].filter(Boolean).join(" · "));
      if (uv != null || sf.occasion != null) rows.push([uv != null ? `Occasion : ${p(uv)}` : "", sf.occasion != null ? `<span class="tf-sf">sans figurines : ${p(sf.occasion)}</span>` : ""].filter(Boolean).join(" · "));
      return rows.length ? `<div class="tf-mini${fig ? " tf-fig" : ""}">${rows.map(r => `<span class="ext tf-bulle">${r}</span>`).join("")}</div>` : ""; })()}
    ${links.length ? `<div class="ext-links ext-bottom">${links.map(([t, u]) => `<a class="btn small-btn" href="${esc(u)}" target="_blank" rel="noopener">${t} ↗</a>`).join("")}</div>` : ""}`);
  /* apparences : en grand avec les autres sur le côté (l'actuelle encadrée) ; un appui l'affiche à la place */
  const nm = itemName(i), full = a => a ? `${nm} (${a})` : nm;
  const gal = (i.alts || []).length ? [{ src: photo, name: full(i.main_name) }, ...i.alts.map(a => ({ src: img(a.photo), name: full(a.name) }))] : null;
  const zoomGal = cur => {
    const z = document.createElement("div"); z.className = "gd-zoomed gd-zg";
    z.innerHTML = `<figure class="zg-fig"><div class="zoom-row"><img class="zg-main" src="${gal[cur].src}" alt="">
      <div class="zoom-side">${gal.map((x, k) => `<button type="button" class="zs-pic ${k === cur ? "on" : ""}" data-zs="${k}" title="${esc(x.name)}"><img src="${x.src}" alt=""></button>`).join("")}</div></div>
      <figcaption>${esc(gal[cur].name)}</figcaption></figure>`;
    z.onclick = e => { const b = e.target.closest("[data-zs]"); if (!b) return z.remove(); const k = +b.dataset.zs;
      z.querySelector(".zg-main").src = gal[k].src; z.querySelector(".zg-fig figcaption").textContent = gal[k].name;
      z.querySelectorAll(".zs-pic").forEach(x => x.classList.toggle("on", x === b)); };
    document.body.append(z);
  };
  d.querySelector(".gd-img").onclick = () => gal ? zoomGal(0) : isFigLike(i) && (i.quantity || 1) > 1   // figurine en plusieurs exemplaires : chacun
    ? openParade(itemName(i), Array.from({ length: i.quantity }, () => ({ src: photo, label: itemName(i) }))) : zoomOne(photo);
  if (altK != null && gal) zoomGal(altK + 1);   // carte d'une apparence : directement elle, en grand
  const wireZoom = root => root.querySelectorAll(".gd-zoom").forEach(im => im.onclick = e => { e.stopPropagation(); zoomOne(im.src); });
  if (i.kind === "fig" && !i.fig_objs && d.querySelector("[data-objs]"))   // objets pas encore connus : demandés au serveur
    fetch(base + "/figobjs?n=" + encodeURIComponent(i.number)).then(r => r.json()).then(r => {
      i.fig_objs = r.objs || []; const box = d.querySelector("[data-objs]"); if (box) { box.innerHTML = objsHtml(i.fig_objs); wireZoom(box); }
    }).catch(() => { const box = d.querySelector("[data-objs]"); if (box) box.innerHTML = ""; });
  wireZoom(d);
  d.querySelectorAll("[data-parade]").forEach(t => t.onclick = e => { e.stopPropagation();   // toutes les figurines du set, chaque exemplaire
    openParade(itemName(i), figs.flatMap(f => Array.from({ length: Math.max(1, f.qty || 1) }, () => ({ src: img(f.image), label: f.name, sub: f.added ? "ajoutée" : "" })))); });
  d.querySelectorAll("[data-hostid]").forEach(b => b.addEventListener("click", () => { const h = data.items.find(x => x.id === b.dataset.hostid); if (h) { d.remove(); openDetail(h); } }));   // un set où elle est rangée
  d.querySelectorAll("[data-galk]").forEach(im => im.onclick = e => { e.stopPropagation(); zoomGal(+im.dataset.galk); });
}
/* fiche d'une figurine d'un set (carte « Dans un set ») : la figurine, et les sets où elle est (un appui ouvre le set) */
function openFigDetail(v) {
  const d = gSheet(esc(v.info.name || v.number), `
    <div class="cfg-top">
      <div class="cfg-pic"><img class="gd-img" src="${img(v._img)}" alt="" title="Agrandir"></div>
      <div>
        ${PRICES() && v._cat != null ? `<div class="gs-price">${money(v._cat)}</div>` : ""}
        <div class="gs-num">${esc(v.number)}</div>
        <div class="cfg-meta">${[v.info.theme, v.info.year].filter(Boolean).map(esc).join(" · ")}</div>
        ${v._mod ? `<div class="card gs-tags"><div class="meta tagline"><span class="tg tg-mod">Modifiée</span></div></div>` : ""}
        ${v.quantity > 1 ? `<div class="gs-qty">Quantité : <b>${nf.format(v.quantity)}</b></div>` : ""}
      </div>
    </div>
    <fieldset><legend>Dans ${v._sets.length > 1 ? "les sets" : "le set"}</legend><div class="gs-figs">${v._sets.map(x => `<button type="button" class="fig figq gs-set" data-set="${data.items.indexOf(x.i)}">
      <span class="fq-pic"><img src="${thumb(x.i.photo_url || x.i.image || setPhoto(x.i))}" alt="" loading="lazy"></span>
      <span class="fq-txt"><span class="fn">${esc(itemName(x.i))}</span><span class="fv">${esc(x.i.number)}${x.n > 1 ? ` · ×${x.n}` : ""}</span></span></button>`).join("")}</div></fieldset>
    ${/^[a-z]+\d+[a-z]?$/i.test(v.number) ? `<div class="ext-links ext-bottom">${gSiteLinks(["BrickLink", blSale("M", v.number, "")], gBoSearch(v.number)).map(([t, u]) => `<a class="btn small-btn" href="${esc(u)}" target="_blank" rel="noopener">${t} ↗</a>`).join("")}<a class="btn small-btn" href="${esc(rbUrl(v.number, true))}" target="_blank" rel="noopener">Rebrickable ↗</a></div>` : ""}`);
  d.querySelector(".gd-img").onclick = () => v.quantity > 1   // plusieurs exemplaires : chacun, avec son set
    ? openParade(v.info.name || v.number, v._sets.flatMap(x => Array.from({ length: x.n }, () => ({ src: img(v._img), label: v.info.name || v.number, sub: x.i.number })))) : zoomOne(img(v._img));
  d.querySelectorAll("[data-set]").forEach(b => b.onclick = () => { d.remove(); openDetail(data.items[+b.dataset.set]); });
}
/* lien vers le compte Instagram, à droite du nom de l'appli (seulement si un compte est relié) */
function setIgHead(u) {
  const a = document.getElementById("igHead"); if (!a) return;
  a.hidden = !u;
  if (u) { a.href = "https://www.instagram.com/" + encodeURIComponent(u) + "/"; a.querySelector(".ig-name").textContent = "@" + u; a.title = "@" + u + " sur Instagram"; }
}
document.addEventListener("click", e => { const c = e.target.closest(".card[data-i], .card[data-v]"); if (!c) return;
  if (c.dataset.v != null) return openFigDetail(VIRT[+c.dataset.v]);   // figurine d'un set : sa fiche, avec ses sets
  openDetail(data.items[+c.dataset.i], c.dataset.alt != null ? +c.dataset.alt : null);
  if (e.target.closest("[data-mp]")) setTimeout(() => document.querySelector(".gdetail .gd-lots")?.previousElementSibling?.scrollIntoView({ behavior: "smooth", block: "start" }), 50);   // « + » : directement à ses pièces
});
document.addEventListener("keydown", e => { if (e.key === "Enter") { const c = e.target.closest?.(".card[data-i], .card[data-v]"); if (c) c.click(); } });

["filter", "sort"].forEach(id => $("#" + id).addEventListener(id === "filter" ? "input" : "change", render));
fetch(base + "/data").then(r => r.ok ? r.json() : Promise.reject(r))
  .then(d => { data = d; setIgHead(d.ig_user);   // /collection : la collection seule ; /wishlist : la liste de souhaits seule ; /a-surveiller : elle seule
    data.page = d.page || (base.startsWith("/collection") ? "collection" : base.startsWith("/a-surveiller") ? "watch" : "wishlist");
    const w = d.lists.find(l => l.kind === "wishlist"); if (w && data.page !== "collection") current = w.id;
    if (data.page === "watch") {
      document.title = "À surveiller — Briquothèque";
      const gt = document.querySelector(".guest-tag"); if (gt) gt.textContent = "À surveiller · lecture seule";
    } else if (data.page === "wishlist") document.title = (d.owner ? `Liste de souhaits de ${d.owner}` : "Liste de souhaits") + " — Briquothèque";
    else document.title = (d.owner ? `Collection de ${d.owner}` : "Collection") + " — Briquothèque";
    render(); })
  .catch(() => { $("#items").innerHTML = `<div class="empty"><div class="big">🔒</div>Page momentanément indisponible.</div>`; $("#stats").innerHTML = ""; });

/* ↑ retour en haut : toujours visible, partout (la page, ou la fenêtre ouverte au premier plan) */
(() => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "to-top"; b.textContent = "↑"; b.title = "Retour en haut"; b.setAttribute("aria-label", "Retour en haut");
  document.body.append(b);
  const scrollable = el => el.scrollHeight > el.clientHeight + 2 && /(auto|scroll)/.test(getComputedStyle(el).overflowY);
  b.onclick = e => {
    e.stopPropagation();
    const top = [...document.querySelectorAll(".gdetail")].filter(m => !m.hidden && m.getClientRects().length).at(-1);
    if (!top) return window.scrollTo({ top: 0, behavior: "smooth" });
    [top, ...top.querySelectorAll("*")].filter(scrollable).forEach(el => el.scrollTo({ top: 0, behavior: "smooth" }));
  };
})();
</script>
<script>
new IntersectionObserver(es => es.forEach(e => { gTilesSeen = e.isIntersecting; gTopShow(); }), { rootMargin: "-70px 0px 0px 0px" }).observe(document.getElementById("stats"));   // téléphone : boutons du haut quand les tuiles sont sorties de l'écran

/* barre des filtres collée en haut pendant le défilement : classe « is-stuck » (fond de verre seulement à ce moment-là — 20/11) */
{ const tb = document.querySelector(".main > .toolbar, .g-main > .toolbar");
  if (tb) { let q = false; const chk = () => { q = false; const top = parseFloat(getComputedStyle(tb).top) || 0, st = scrollY > 0 && tb.getBoundingClientRect().top <= top + 1;
      if (tb.classList.contains("is-stuck") !== st) tb.classList.toggle("is-stuck", st); };
    const later = () => { if (!q) { q = true; requestAnimationFrame(chk); } };
    addEventListener("scroll", later, { passive: true }); addEventListener("resize", later); later(); } }
</script>
</body>
