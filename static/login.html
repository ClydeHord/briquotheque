<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d01012">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Connexion — Briquothèque</title>
<style>
  :root { --bg:#f4f5f7; --panel:#fff; --ink:#1b1d22; --muted:#6b7280; --line:#e4e6eb; --red:#d01012; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111317; --panel:#1b1e24; --ink:#eceef2; --muted:#9aa1ad; --line:#2b2f37; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
    font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  form { width:min(380px,100%); background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:28px 26px; box-shadow:0 10px 40px rgba(0,0,0,.08); }
  .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:21px; margin-bottom:18px; }
  .brick { position:relative; width:30px; height:20px; background:var(--red); border-radius:4px; margin-top:6px; }
  .brick i { position:absolute; top:-6px; width:9px; height:7px; background:var(--red); border-radius:3px 3px 0 0; }
  .brick i:first-child { left:4px; } .brick i:last-child { right:4px; }
  label { display:block; font-weight:600; font-size:13px; margin-bottom:6px; }
  input { width:100%; font:inherit; color:inherit; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--panel); }
  input:focus { outline:2px solid var(--red); outline-offset:-1px; border-color:transparent; }
  button { width:100%; margin-top:14px; font:inherit; font-weight:700; padding:11px; border:0; border-radius:10px; background:var(--red); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; }
  .remember { display:flex; align-items:center; gap:8px; margin-top:12px; font-weight:500; font-size:14px; cursor:pointer; }
  .remember input { width:18px; height:18px; accent-color:var(--red); margin:0; }
  input#pwd { font-size:16px; }
  .err { color:var(--red); font-size:13.5px; min-height:20px; margin-top:10px; }
  p { color:var(--muted); font-size:13px; margin:0 0 16px; }
</style>
</head>
<body>
<form id="f">
  <div class="brand"><span class="brick"><i></i><i></i></span>Briquothèque</div>
  <p>Accès protégé. Saisir le mot de passe pour ouvrir la collection.</p>
  <label for="pwd">Mot de passe</label>
  <input type="password" id="pwd" autocomplete="current-password" autofocus required>
  <label class="remember"><input type="checkbox" id="remember" checked> Rester connecté sur cet appareil</label>
  <button id="b">Se connecter</button>
  <div class="err" id="err"></div>
</form>
<script>
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const b = document.getElementById("b"), err = document.getElementById("err");
  b.disabled = true; err.textContent = "";
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("pwd").value, remember: document.getElementById("remember").checked }) });
    const d = await r.json().catch(() => ({}));
    if (r.ok) { location.href = "/"; return; }
    err.textContent = d.erreur || "Connexion impossible";
  } catch { err.textContent = "Serveur injoignable"; }
  b.disabled = false;
};
</script>
</body>
</html>
