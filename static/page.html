<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Briquothèque</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/style.css">
<script>/* appli installée : une page publique n'y reste jamais — en revenant dans l'appli, retour à l'appli privée (navigateur ordinaire : rien) */
(() => { const sa = matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches || navigator.standalone === true; if (!sa) return;
  let hid = 0; document.addEventListener("visibilitychange", () => { if (document.hidden) hid = Date.now(); else if (hid && Date.now() - hid > 1500) location.replace("/"); });
  addEventListener("pageshow", e => { if (e.persisted) location.replace("/"); }); })();</script>
</head>
<!-- Page créée dans le back office (rubrique « Pages ») et cochée « publique » : adresse /p/<adresse>.
     Le serveur glisse ici les réglages publics et la page à afficher (backoffice.inject) ; bo-max.js dessine ses blocs dans #boPage. -->
<body class="bo-public-page">
<header class="topbar">
  <div class="brand"><span class="brick" aria-hidden="true"><i></i><i></i></span><span>Briquothèque</span></div>
</header>
<main class="bo-pp-main"><section id="boPage"></section></main>
<noscript><p style="margin:30px">Cette page a besoin de JavaScript pour s'afficher.</p></noscript>
</body>
</html>
